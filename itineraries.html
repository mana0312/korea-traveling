<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的行程 · 首爾漫遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-head">
  <div class="page-head-inner">
    <div class="eyebrow"><span class="rule"></span>ITINERARY</div>
    <h1>我的行程</h1>
    <p>從「景點美食」頁面加入的項目會依天數排列在這裡,可以調整順序或移除。</p>
  </div>
</header>

<nav class="sitenav">
  <div class="sitenav-inner">
    <a href="index.html">首頁</a>
    <a href="destinations.html">景點美食</a>
    <a href="itineraries.html" class="active">我的行程</a>
    <a href="packing.html">行李清單</a>
  </div>
</nav>

<main>
  <div class="day-tabs" id="day-tabs"></div>
  <div class="plan-list" id="plan-list"></div>
  <div class="plan-toolbar">
    <button class="ghost-btn" id="export-btn">匯出文字行程</button>
  </div>
</main>

<footer>首爾漫遊 · 為自由行旅人設計的簡易規劃工具</footer>

<script src="data.js"></script>
<script>
let plan = loadPlan();
let currentDay = loadSelectedDay();

function renderDayTabs(){
  document.getElementById('day-tabs').innerHTML = [1,2,3].map(d =>
    `<button class="day-tab ${currentDay===d?'active':''}" data-day="${d}">第 ${d} 天</button>`
  ).join('');
}

function normalizeItem(item){
  return typeof item === 'string' ? { name:item, start:'', end:'' } : item;
}

function renderPlan(){
  const list = plan[currentDay];
  const container = document.getElementById('plan-list');
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state">這天還沒有安排,前往「景點美食」頁面點選加入行程。</div>`;
    return;
  }
  container.innerHTML = list.map((raw, i) => {
    const item = normalizeItem(raw);
    return `
    <div class="plan-item">
      <span class="plan-index">${String(i+1).padStart(2,'0')}</span>
      <div class="plan-main">
        <span class="plan-name">${item.name}</span>
        <div class="plan-time">
          <input type="time" data-time="${i}:start" value="${item.start || ''}">
          <span class="plan-time-sep">–</span>
          <input type="time" data-time="${i}:end" value="${item.end || ''}">
        </div>
      </div>
      <div class="plan-actions">
        <button class="icon-btn" data-move="${i}:-1" aria-label="上移">↑</button>
        <button class="icon-btn" data-move="${i}:1" aria-label="下移">↓</button>
        <button class="icon-btn" data-remove="${i}" aria-label="移除">✕</button>
      </div>
    </div>`;
  }).join('');
}

function renderAll(){
  renderDayTabs();
  renderPlan();
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll('[data-day]').forEach(btn =>
    btn.onclick = () => { currentDay = parseInt(btn.dataset.day, 10); saveSelectedDay(currentDay); renderDayTabs(); renderPlan(); bindEvents(); });

  document.querySelectorAll('[data-remove]').forEach(btn =>
    btn.onclick = () => {
      plan[currentDay].splice(parseInt(btn.dataset.remove, 10), 1);
      savePlan(plan);
      renderPlan();
      bindEvents();
    });

  document.querySelectorAll('[data-move]').forEach(btn =>
    btn.onclick = () => {
      const [idx, dir] = btn.dataset.move.split(':').map(Number);
      const list = plan[currentDay];
      const target = idx + dir;
      if(target < 0 || target >= list.length) return;
      [list[idx], list[target]] = [list[target], list[idx]];
      savePlan(plan);
      renderPlan();
      bindEvents();
    });

  document.querySelectorAll('[data-time]').forEach(input =>
    input.onchange = () => {
      const [idxStr, field] = input.dataset.time.split(':');
      const idx = parseInt(idxStr, 10);
      plan[currentDay][idx] = normalizeItem(plan[currentDay][idx]);
      plan[currentDay][idx][field] = input.value;
      savePlan(plan);
    });
}

document.getElementById('export-btn').onclick = () => {
  let text = '首爾行程規劃\n\n';
  [1,2,3].forEach(d => {
    text += `第 ${d} 天\n`;
    if(plan[d].length === 0){
      text += '(尚未安排)\n';
    } else {
      plan[d].forEach((raw, i) => {
        const item = normalizeItem(raw);
        const time = (item.start || item.end) ? ` (${item.start || '?'}–${item.end || '?'})` : '';
        text += `${i+1}. ${item.name}${time}\n`;
      });
    }
    text += '\n';
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '首爾行程.txt';
  a.click();
  URL.revokeObjectURL(url);
};

renderAll();
</script>
</body>
</html>
