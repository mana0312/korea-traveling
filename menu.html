<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-head">
  <div class="page-head-inner">
    <div class="eyebrow"><span class="rule"></span>MENU</div>
    <h1>餐廳菜單</h1>
    <p>「景點美食」頁面裡每家餐廳的推薦菜色中韓對照,點餐時可以直接比對菜單上的韓文。實際菜單品項與價格請以現場為準。</p>
  </div>
</header>

<nav class="sitenav">
  <div class="sitenav-inner">
    <a href="index.html">首頁</a>
    <a href="destinations.html">景點美食</a>
    <a href="itineraries.html">我的行程</a>
    <a href="flights.html">機場航班</a>
    <a href="accommodation.html">住宿</a>
    <a href="navigate.html">路線規劃</a>
    <a href="transit-live.html">即時交通</a>
    <a href="menu.html" class="active">餐廳菜單</a>
    <a href="packing.html">行李清單</a>
  </div>
</nav>

<main>
  <div class="section-head">
    <h2>點餐常用韓文</h2>
    <p>先學這幾句,現場溝通更順暢。</p>
  </div>
  <div class="phrase-grid" id="phrase-grid"></div>

  <div class="section-head" style="margin-top:36px;">
    <h2>各店推薦菜色</h2>
    <p>依「景點美食」頁面的美食清單整理,韓文原名對照中文翻譯。</p>
  </div>
  <div id="menu-cards"></div>
</main>

<footer>首爾漫遊 · 為自由行旅人設計的簡易規劃工具</footer>

<script src="data.js"></script>
<script>
function renderPhrases(){
  document.getElementById('phrase-grid').innerHTML = DINING_PHRASES.map(p => `
    <div class="phrase-item">
      <span class="phrase-ko">${p.ko}</span>
      <span class="phrase-zh">${p.zh}</span>
    </div>`).join('');
}

function menuCardHTML(food){
  const dishes = MENUS[food.n] || [];
  const mapRow = food.mapQuery
    ? `<a class="map-link" href="${mapLink(food.mapQuery)}" target="_blank" rel="noopener">
         <span class="map-icon">📍</span>在地圖上查看
       </a>`
    : '';
  const dishesHTML = dishes.length > 0
    ? dishes.map(d => `
      <div class="dish-row">
        <span class="dish-ko">${d.ko}</span>
        <span class="dish-zh">${d.zh}</span>
      </div>`).join('')
    : `<p class="desc">暫無推薦菜色資料。</p>`;
  return `
  <div class="flight-card">
    <div class="flight-card-head">
      <h3>${food.n}</h3>
      <span class="flight-hint">${food.tag}</span>
    </div>
    ${food.hours ? `<p class="hours"><span class="hours-icon">⏱</span>${food.hours}</p>` : ''}
    <div class="dish-list">${dishesHTML}</div>
    <div style="margin-top:12px;">${mapRow}</div>
  </div>`;
}

document.getElementById('menu-cards').innerHTML =
  FOOD.map(f => menuCardHTML(f)).join('');
renderPhrases();
</script>
</body>
</html>
